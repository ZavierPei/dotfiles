# 字体设置
font_family             MesloLGS NF Regular
bold_font               MesloLGS NF Bold
italic_font             MesloLGS NF Italic
bold_italic_font        MesloLGS NF Bold Italic
font_size               14

# 内边距：让代码呼吸
window_padding_width    4
window_margin_width     2

# 窗口设置
# hide_window_decorations yes
initial_window_width    116c
initial_window_height   34c
remember_window_size    no
background_opacity      0.8
background_blur         30

# 标签栏设置
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted

# 光标设置
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# 光标样式：在 Python REPL 中更醒目
cursor_shape            block
cursor_blink_interval   0

# 其他设置
allow_hyperlinks        yes
shell_integration       no-cursor
cursor_shape            block
open_url_with           default

# 增加回滚行数，应对 Python 长输出
scrollback_lines        20000

# 降低延迟，提升交互式 Python REPL 体验
repaint_delay           5
input_delay             1
sync_to_monitor         no

# 启用 Shell 集成 - 与 LazyVim 终端协作
shell_integration       enabled

# 长命令通知：Python 测试/脚本完成时提醒
notify_on_cmd_finish    invisible 5

# BEGIN_KITTY_THEME
# Monokai Pro (Filter Octagon)
include current-theme.conf
# END_KITTY_THEME
